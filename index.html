<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ApexLog - Workout Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ApexLog">
  <meta name="theme-color" content="#09090b">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#a3e635',
              500: '#84cc16',
              600: '#65a30d',
            },
            zinc: {
              850: '#1f1f23',
              900: '#18181b',
              950: '#09090b'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons & React Dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* iOS Momentum Scrolling & Safe Area handling */
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overscroll-behavior-y: none;
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen selection:bg-brand-500/30 selection:text-brand-400 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- DEFAULT PRE-POPULATED EXERCISES ---
    const DEFAULT_EXERCISES = [
      { id: 'bench-press', name: 'Barbell Bench Press', category: 'Chest', defaultSplits: ['push', 'upper'] },
      { id: 'incline-db-press', name: 'Incline Dumbbell Press', category: 'Chest', defaultSplits: ['push', 'upper'] },
      { id: 'barbell-overhead-press', name: 'Overhead Press (OHP)', category: 'Shoulders', defaultSplits: ['push', 'upper'] },
      { id: 'lateral-raise', name: 'Dumbbell Lateral Raise', category: 'Shoulders', defaultSplits: ['push', 'upper'] },
      { id: 'tricep-pushdown', name: 'Tricep Rope Pushdown', category: 'Triceps', defaultSplits: ['push', 'upper'] },
      { id: 'barbell-row', name: 'Barbell Bent Over Row', category: 'Back', defaultSplits: ['pull', 'upper'] },
      { id: 'lat-pulldown', name: 'Lat Pulldown', category: 'Back', defaultSplits: ['pull', 'upper'] },
      { id: 'face-pull', name: 'Cable Face Pull', category: 'Shoulders', defaultSplits: ['pull', 'upper'] },
      { id: 'incline-bicep-curl', name: 'Incline Dumbbell Curl', category: 'Biceps', defaultSplits: ['pull', 'upper'] },
      { id: 'barbell-squat', name: 'Barbell Back Squat', category: 'Quads', defaultSplits: ['legs'] },
      { id: 'romanian-deadlift', name: 'Romanian Deadlift (RDL)', category: 'Hamstrings', defaultSplits: ['legs', 'pull'] },
      { id: 'leg-press', name: 'Leg Press', category: 'Quads', defaultSplits: ['legs'] },
      { id: 'leg-curl', name: 'Lying Hamstring Curl', category: 'Hamstrings', defaultSplits: ['legs'] },
      { id: 'calf-raise', name: 'Standing Calf Raise', category: 'Calves', defaultSplits: ['legs'] },
    ];

    const SPLIT_CONFIG = {
      push: { name: 'Push', color: 'from-amber-500/20 to-orange-500/10 border-amber-500/30 text-amber-400' },
      pull: { name: 'Pull', color: 'from-sky-500/20 to-blue-500/10 border-sky-500/30 text-sky-400' },
      legs: { name: 'Legs', color: 'from-emerald-500/20 to-teal-500/10 border-emerald-500/30 text-emerald-400' },
      upper: { name: 'Upper', color: 'from-purple-500/20 to-indigo-500/10 border-purple-500/30 text-purple-400' },
      custom: { name: 'Custom', color: 'from-zinc-500/20 to-zinc-600/10 border-zinc-500/30 text-zinc-300' }
    };

    // --- STORAGE HELPERS (Local-First Offline) ---
    const STORAGE_KEY_EXERCISES = 'apexlog_exercises_v1';
    const STORAGE_KEY_HISTORY = 'apexlog_history_v1';
    const STORAGE_KEY_ACTIVE = 'apexlog_active_session_v1';

    function loadLocal(key, defaultVal) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : defaultVal;
      } catch (e) {
        console.error("Failed to load", key, e);
        return defaultVal;
      }
    }

    function saveLocal(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        console.error("Failed to save", key, e);
      }
    }

    // --- AUDIO TONE FOR REST TIMER ---
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 tone
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {
        console.log("AudioContext playback prevented or not supported");
      }
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      // Nav State
      const [currentTab, setCurrentTab] = useState('workout'); // 'workout' | 'history' | 'exercises' | 'analytics'
      
      // Core Data
      const [exercises, setExercises] = useState(() => loadLocal(STORAGE_KEY_EXERCISES, DEFAULT_EXERCISES));
      const [workoutHistory, setWorkoutHistory] = useState(() => loadLocal(STORAGE_KEY_HISTORY, []));
      const [activeSession, setActiveSession] = useState(() => loadLocal(STORAGE_KEY_ACTIVE, null));

      // Active UI Modals / Drawer
      const [showExercisePicker, setShowExercisePicker] = useState(false);
      const [exerciseSearch, setExerciseSearch] = useState('');
      const [newExName, setNewExName] = useState('');
      const [newExCategory, setNewExCategory] = useState('Chest');
      const [inspectExerciseId, setInspectExerciseId] = useState(null);

      // Rest Timer State
      const [timerRemaining, setTimerRemaining] = useState(0);
      const [isTimerActive, setIsTimerActive] = useState(false);
      const timerRef = useRef(null);

      // Save Data Effects
      useEffect(() => {
        saveLocal(STORAGE_KEY_EXERCISES, exercises);
      }, [exercises]);

      useEffect(() => {
        saveLocal(STORAGE_KEY_HISTORY, workoutHistory);
      }, [workoutHistory]);

      useEffect(() => {
        saveLocal(STORAGE_KEY_ACTIVE, activeSession);
      }, [activeSession]);

      // Timer Tick Effect
      useEffect(() => {
        if (isTimerActive && timerRemaining > 0) {
          timerRef.current = setInterval(() => {
            setTimerRemaining(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                setIsTimerActive(false);
                playBeep();
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isTimerActive, timerRemaining]);

      const startTimer = (seconds) => {
        setTimerRemaining(seconds);
        setIsTimerActive(true);
      };

      // --- CRITICAL ARCHITECTURAL FUNCTION ---
      // Retrieves the single most recent performance of any exercise across ALL historical workouts,
      // ignoring whether it was done in Push, Pull, Legs, Upper or Custom.
      const getLastExercisePerformance = (exerciseId) => {
        // Sort history reverse chronologically
        for (const workout of workoutHistory) {
          const matchingEx = workout.exercises?.find(e => e.exerciseId === exerciseId);
          if (matchingEx && matchingEx.sets?.length > 0) {
            // Found the latest time this exact exercise was performed
            const completedSets = matchingEx.sets.filter(s => s.completed);
            if (completedSets.length > 0) {
              const dateObj = new Date(workout.startTime);
              const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
              const splitName = workout.splitType.charAt(0).toUpperCase() + workout.splitType.slice(1);
              const setsSummary = completedSets.map(s => `${s.weight}kg×${s.reps}`).join(', ');
              return {
                split: splitName,
                date: formattedDate,
                rawDate: workout.startTime,
                summary: setsSummary,
                sets: completedSets
              };
            }
          }
        }
        return null;
      };

      // --- WORKOUT ACTIONS ---
      const startWorkout = (splitType) => {
        // Auto-suggest exercises default for this split
        const suggested = exercises.filter(e => e.defaultSplits?.includes(splitType));
        const initialWorkoutExercises = suggested.slice(0, 4).map(ex => {
          // Pre-populate with first set
          return {
            exerciseId: ex.id,
            sets: [
              { id: 's_' + Date.now() + Math.random(), weight: 20, reps: 10, completed: false }
            ]
          };
        });

        const newSession = {
          id: 'w_' + Date.now(),
          splitType: splitType,
          startTime: new Date().toISOString(),
          exercises: initialWorkoutExercises
        };
        setActiveSession(newSession);
      };

      const finishWorkout = () => {
        if (!activeSession) return;
        
        // Filter out exercises with no completed sets
        const finishedSession = {
          ...activeSession,
          endTime: new Date().toISOString(),
          exercises: activeSession.exercises.map(ex => ({
            ...ex,
            sets: ex.sets.filter(s => s.completed)
          })).filter(ex => ex.sets.length > 0)
        };

        if (finishedSession.exercises.length > 0) {
          setWorkoutHistory([finishedSession, ...workoutHistory]);
        }
        setActiveSession(null);
        setCurrentTab('history');
      };

      const cancelWorkout = () => {
        if (confirm("Discard current workout session?")) {
          setActiveSession(null);
        }
      };

      const addExerciseToActiveWorkout = (exerciseId) => {
        if (!activeSession) return;
        if (activeSession.exercises.some(e => e.exerciseId === exerciseId)) {
          setShowExercisePicker(false);
          return;
        }

        // Get last performance to pre-seed weight
        const lastPerf = getLastExercisePerformance(exerciseId);
        const seedWeight = lastPerf?.sets?.[0]?.weight || 20;
        const seedReps = lastPerf?.sets?.[0]?.reps || 10;

        const updated = {
          ...activeSession,
          exercises: [
            ...activeSession.exercises,
            {
              exerciseId,
              sets: [
                { id: 's_' + Date.now(), weight: seedWeight, reps: seedReps, completed: false }
              ]
            }
          ]
        };
        setActiveSession(updated);
        setShowExercisePicker(false);
      };

      const removeExerciseFromActiveWorkout = (exerciseIndex) => {
        const updated = { ...activeSession };
        updated.exercises.splice(exerciseIndex, 1);
        setActiveSession(updated);
      };

      const addSet = (exerciseIndex) => {
        const updated = { ...activeSession };
        const currentEx = updated.exercises[exerciseIndex];
        const lastSet = currentEx.sets[currentEx.sets.length - 1];
        
        const newWeight = lastSet ? lastSet.weight : 20;
        const newReps = lastSet ? lastSet.reps : 10;

        currentEx.sets.push({
          id: 's_' + Date.now() + Math.random(),
          weight: newWeight,
          reps: newReps,
          completed: false
        });
        setActiveSession(updated);
      };

      const removeSet = (exerciseIndex, setIndex) => {
        const updated = { ...activeSession };
        updated.exercises[exerciseIndex].sets.splice(setIndex, 1);
        setActiveSession(updated);
      };

      const updateSet = (exerciseIndex, setIndex, field, val) => {
        const updated = { ...activeSession };
        const set = updated.exercises[exerciseIndex].sets[setIndex];
        set[field] = Math.max(0, val);
        setActiveSession(updated);
      };

      const toggleSetCompleted = (exerciseIndex, setIndex) => {
        const updated = { ...activeSession };
        const set = updated.exercises[exerciseIndex].sets[setIndex];
        const nextState = !set.completed;
        set.completed = nextState;
        setActiveSession(updated);

        // Auto trigger 90-sec rest timer on checkmark completion
        if (nextState) {
          startTimer(90);
        }
      };

      const createCustomExercise = (e) => {
        e.preventDefault();
        if (!newExName.trim()) return;
        const newId = newExName.toLowerCase().replace(/[^a-z0-9]/g, '-');
        const newEx = {
          id: newId,
          name: newExName.trim(),
          category: newExCategory,
          defaultSplits: ['custom']
        };
        setExercises([...exercises, newEx]);
        setNewExName('');
        if (activeSession) {
          addExerciseToActiveWorkout(newId);
        }
      };

      // --- EXPORT / IMPORT DATA ---
      const exportDataJSON = () => {
        const data = { exercises, workoutHistory };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ApexLog_Backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      return (
        <div className="flex flex-col min-h-screen bg-zinc-950 text-zinc-100 max-w-lg mx-auto relative shadow-2xl pb-24">
          
          {/* HEADER BAR */}
          <header className="sticky top-0 z-30 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-850 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-500 to-brand-400 flex items-center justify-center font-black text-zinc-950 text-lg shadow-lg shadow-brand-500/20">
                ▲
              </div>
              <div>
                <h1 className="text-base font-bold tracking-tight text-white leading-none">ApexLog</h1>
                <span className="text-[10px] text-zinc-400 font-medium tracking-wider uppercase">Cross-Split Tracker</span>
              </div>
            </div>

            {/* Rest Timer Float / Quick Trigger */}
            <div className="flex items-center space-x-2">
              {timerRemaining > 0 ? (
                <div 
                  onClick={() => setIsTimerActive(!isTimerActive)}
                  className="flex items-center space-x-1.5 px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/30 text-brand-400 font-mono text-xs font-semibold cursor-pointer animate-pulse"
                >
                  <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" strokeWidth="2.5" />
                    <polyline points="12 6 12 12 16 14" strokeWidth="2.5" />
                  </svg>
                  <span>{Math.floor(timerRemaining / 60)}:{String(timerRemaining % 60).padStart(2, '0')}</span>
                </div>
              ) : (
                <button 
                  onClick={() => startTimer(90)} 
                  className="px-2.5 py-1 text-xs font-medium text-zinc-400 bg-zinc-900 hover:bg-zinc-850 border border-zinc-800 rounded-lg flex items-center space-x-1"
                >
                  <svg className="w-3.5 h-3.5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" strokeWidth="2" />
                    <polyline points="12 6 12 12 16 14" strokeWidth="2" />
                  </svg>
                  <span>90s</span>
                </button>
              )}
            </div>
          </header>

          {/* MAIN BODY AREA */}
          <main className="flex-1 px-4 py-4 overflow-y-auto">

            {/* TAB 1: WORKOUT TAB */}
            {currentTab === 'workout' && (
              <div>
                {/* NO ACTIVE WORKOUT -> SPLIT SELECTION */}
                {!activeSession ? (
                  <div className="space-y-6 pt-2">
                    <div>
                      <h2 className="text-xl font-bold text-white tracking-tight">Ready to Train?</h2>
                      <p className="text-xs text-zinc-400 mt-1">
                        Select today's split. Exercises will pull performance seamlessly across Push, Pull, Legs & Upper.
                      </p>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      {['push', 'pull', 'legs', 'upper'].map(split => {
                        const conf = SPLIT_CONFIG[split];
                        return (
                          <button
                            key={split}
                            onClick={() => startWorkout(split)}
                            className={`p-4 rounded-2xl border bg-gradient-to-br ${conf.color} text-left flex flex-col justify-between h-32 active:scale-95 transition-all shadow-md`}
                          >
                            <span className="text-xs font-semibold tracking-wider uppercase opacity-80">Routine</span>
                            <div>
                              <div className="text-2xl font-black text-white">{conf.name}</div>
                              <span className="text-[11px] text-zinc-300">
                                {split === 'upper' ? 'Push + Pull Overlaps' : `${conf.name} Targets`}
                              </span>
                            </div>
                          </button>
                        );
                      })}
                    </div>

                    <button
                      onClick={() => startWorkout('custom')}
                      className="w-full py-3.5 px-4 rounded-xl border border-dashed border-zinc-800 hover:border-zinc-700 bg-zinc-900/60 text-zinc-300 text-sm font-semibold flex items-center justify-center space-x-2 active:bg-zinc-850"
                    >
                      <span>+ Custom / Empty Workout</span>
                    </button>

                    {/* Quick Stats Banner */}
                    <div className="mt-8 p-4 rounded-xl bg-zinc-900/70 border border-zinc-800 flex items-center justify-between">
                      <div>
                        <div className="text-xs text-zinc-400">Total Logged Sessions</div>
                        <div className="text-xl font-bold text-white font-mono mt-0.5">{workoutHistory.length}</div>
                      </div>
                      <div className="text-right">
                        <div className="text-xs text-zinc-400">Master Exercises</div>
                        <div className="text-xl font-bold text-brand-400 font-mono mt-0.5">{exercises.length}</div>
                      </div>
                    </div>
                  </div>
                ) : (
                  /* ACTIVE WORKOUT IN PROGRESS */
                  <div className="space-y-5 pb-12">
                    {/* Active Workout Status Card */}
                    <div className="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 rounded-xl p-3">
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="w-2.5 h-2.5 rounded-full bg-brand-500 animate-ping"></span>
                          <span className="text-sm font-bold text-white uppercase tracking-wider">
                            {SPLIT_CONFIG[activeSession.splitType]?.name || 'Custom'} Workout
                          </span>
                        </div>
                        <span className="text-[11px] text-zinc-400">
                          Started {new Date(activeSession.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </span>
                      </div>
                      <div className="flex space-x-2">
                        <button
                          onClick={cancelWorkout}
                          className="px-2.5 py-1 text-xs text-zinc-400 bg-zinc-800/80 hover:bg-zinc-800 rounded-lg"
                        >
                          Cancel
                        </button>
                        <button
                          onClick={finishWorkout}
                          className="px-3 py-1 text-xs font-bold bg-brand-500 text-zinc-950 rounded-lg shadow-lg shadow-brand-500/20 active:scale-95"
                        >
                          Finish
                        </button>
                      </div>
                    </div>

                    {/* Active Exercises List */}
                    {activeSession.exercises.map((item, exIdx) => {
                      const exerciseMeta = exercises.find(e => e.id === item.exerciseId) || { name: item.exerciseId, category: 'General' };
                      const lastPerf = getLastExercisePerformance(item.exerciseId);

                      return (
                        <div key={item.exerciseId} className="bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 shadow-sm space-y-3">
                          {/* Exercise Header & CROSS-SPLIT PREVIOUS DATA BANNER */}
                          <div className="flex items-start justify-between">
                            <div>
                              <h3 className="text-base font-bold text-white leading-snug">{exerciseMeta.name}</h3>
                              <span className="text-[11px] text-zinc-400 font-medium">{exerciseMeta.category}</span>
                            </div>
                            <button
                              onClick={() => removeExerciseFromActiveWorkout(exIdx)}
                              className="text-zinc-500 hover:text-red-400 p-1"
                              title="Remove exercise"
                            >
                              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                              </svg>
                            </button>
                          </div>

                          {/* THE CORE SOLUTION: Cross-Workout History Display */}
                          <div className="bg-zinc-950/70 rounded-xl p-2.5 border border-zinc-800/80 flex items-center justify-between text-xs">
                            <div className="flex items-center space-x-2 truncate">
                              <span className="px-1.5 py-0.5 rounded text-[10px] font-bold bg-zinc-800 text-brand-400 uppercase tracking-wider">
                                Last Perf
                              </span>
                              {lastPerf ? (
                                <span className="text-zinc-300 truncate">
                                  <span className="text-zinc-400 font-medium">({lastPerf.split} • {lastPerf.date}):</span>{' '}
                                  <strong className="text-white font-mono">{lastPerf.summary}</strong>
                                </span>
                              ) : (
                                <span className="text-zinc-500 italic">No previous sets logged yet</span>
                              )}
                            </div>
                            {lastPerf && (
                              <button 
                                onClick={() => setInspectExerciseId(item.exerciseId)}
                                className="text-[11px] text-brand-400 underline pl-2 shrink-0 font-medium"
                              >
                                History
                              </button>
                            )}
                          </div>

                          {/* Set Rows Header */}
                          <div className="grid grid-cols-12 text-[11px] font-bold text-zinc-400 px-1 pt-1 uppercase tracking-wider">
                            <span className="col-span-2 text-center">Set</span>
                            <span className="col-span-4 text-center">Weight (kg)</span>
                            <span className="col-span-3 text-center">Reps</span>
                            <span className="col-span-3 text-center">Done</span>
                          </div>

                          {/* Individual Set Rows */}
                          <div className="space-y-2">
                            {item.sets.map((set, setIdx) => (
                              <div
                                key={set.id}
                                className={`grid grid-cols-12 items-center gap-1.5 p-1.5 rounded-xl transition-all ${
                                  set.completed ? 'bg-brand-500/10 border border-brand-500/20' : 'bg-zinc-950 border border-zinc-850'
                                }`}
                              >
                                {/* Set Index */}
                                <div className="col-span-2 flex items-center justify-center font-mono font-bold text-sm text-zinc-400">
                                  {setIdx + 1}
                                </div>

                                {/* Weight Control */}
                                <div className="col-span-4 flex items-center justify-between bg-zinc-900 rounded-lg p-1 border border-zinc-800">
                                  <button
                                    onClick={() => updateSet(exIdx, setIdx, 'weight', set.weight - 2.5)}
                                    className="w-6 h-7 rounded bg-zinc-800 text-zinc-300 font-bold text-xs active:bg-zinc-700 flex items-center justify-center"
                                  >
                                    -
                                  </button>
                                  <input
                                    type="number"
                                    step="0.5"
                                    value={set.weight}
                                    onChange={(e) => updateSet(exIdx, setIdx, 'weight', parseFloat(e.target.value) || 0)}
                                    className="w-12 text-center bg-transparent font-mono font-bold text-sm text-white focus:outline-none"
                                  />
                                  <button
                                    onClick={() => updateSet(exIdx, setIdx, 'weight', set.weight + 2.5)}
                                    className="w-6 h-7 rounded bg-zinc-800 text-zinc-300 font-bold text-xs active:bg-zinc-700 flex items-center justify-center"
                                  >
                                    +
                                  </button>
                                </div>

                                {/* Reps Control */}
                                <div className="col-span-3 flex items-center justify-between bg-zinc-900 rounded-lg p-1 border border-zinc-800">
                                  <button
                                    onClick={() => updateSet(exIdx, setIdx, 'reps', set.reps - 1)}
                                    className="w-5 h-7 rounded bg-zinc-800 text-zinc-300 font-bold text-xs active:bg-zinc-700 flex items-center justify-center"
                                  >
                                    -
                                  </button>
                                  <input
                                    type="number"
                                    value={set.reps}
                                    onChange={(e) => updateSet(exIdx, setIdx, 'reps', parseInt(e.target.value) || 0)}
                                    className="w-8 text-center bg-transparent font-mono font-bold text-sm text-white focus:outline-none"
                                  />
                                  <button
                                    onClick={() => updateSet(exIdx, setIdx, 'reps', set.reps + 1)}
                                    className="w-5 h-7 rounded bg-zinc-800 text-zinc-300 font-bold text-xs active:bg-zinc-700 flex items-center justify-center"
                                  >
                                    +
                                  </button>
                                </div>

                                {/* Completed Checkmark Toggle */}
                                <div className="col-span-3 flex items-center justify-center space-x-1">
                                  <button
                                    onClick={() => toggleSetCompleted(exIdx, setIdx)}
                                    className={`w-9 h-8 rounded-lg flex items-center justify-center transition-all ${
                                      set.completed
                                        ? 'bg-brand-500 text-zinc-950 shadow-md shadow-brand-500/30'
                                        : 'bg-zinc-850 text-zinc-500 hover:text-zinc-300 border border-zinc-700'
                                    }`}
                                  >
                                    <svg className="w-5 h-5 stroke-[3]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                      <polyline points="20 6 9 17 4 12" />
                                    </svg>
                                  </button>
                                  {item.sets.length > 1 && (
                                    <button
                                      onClick={() => removeSet(exIdx, setIdx)}
                                      className="text-zinc-600 hover:text-red-400 p-0.5"
                                    >
                                      <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                      </svg>
                                    </button>
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>

                          {/* Add Set Button */}
                          <button
                            onClick={() => addSet(exIdx)}
                            className="w-full py-2 bg-zinc-950 hover:bg-zinc-850 border border-zinc-800 text-zinc-300 text-xs font-semibold rounded-xl flex items-center justify-center space-x-1"
                          >
                            <span>+ Add Set</span>
                          </button>
                        </div>
                      );
                    })}

                    {/* Add Exercise Floating / Trigger */}
                    <button
                      onClick={() => setShowExercisePicker(true)}
                      className="w-full py-3.5 bg-zinc-900 border border-zinc-800 text-brand-400 hover:border-brand-500/40 rounded-2xl text-sm font-bold flex items-center justify-center space-x-2 active:scale-98 transition-all"
                    >
                      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <line x1="12" y1="5" x2="12" y2="19" strokeWidth="2.5" strokeLinecap="round"/>
                        <line x1="5" y1="12" x2="19" y2="12" strokeWidth="2.5" strokeLinecap="round"/>
                      </svg>
                      <span>Add Exercise</span>
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: WORKOUT HISTORY TAB */}
            {currentTab === 'history' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold text-white tracking-tight">Workout Logs</h2>
                  <span className="text-xs text-zinc-400 font-mono">{workoutHistory.length} Sessions</span>
                </div>

                {workoutHistory.length === 0 ? (
                  <div className="text-center py-12 text-zinc-500 text-sm">
                    No completed workouts logged yet. Start a session from the Workout tab!
                  </div>
                ) : (
                  workoutHistory.map((item) => {
                    const date = new Date(item.startTime).toLocaleDateString('en-US', {
                      weekday: 'short',
                      month: 'short',
                      day: 'numeric'
                    });
                    const time = new Date(item.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    // Calculate total session tonnage volume
                    let totalVolume = 0;
                    item.exercises?.forEach(e => {
                      e.sets?.forEach(s => {
                        totalVolume += (s.weight || 0) * (s.reps || 0);
                      });
                    });

                    return (
                      <div key={item.id} className="bg-zinc-900/90 border border-zinc-850 rounded-2xl p-4 space-y-3">
                        <div className="flex items-start justify-between">
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="text-base font-bold text-white capitalize">{item.splitType} Day</span>
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-zinc-800 text-zinc-300">
                                {totalVolume.toLocaleString()} kg vol
                              </span>
                            </div>
                            <span className="text-xs text-zinc-400">{date} at {time}</span>
                          </div>
                          <button
                            onClick={() => {
                              if (confirm("Delete this workout from history?")) {
                                setWorkoutHistory(workoutHistory.filter(w => w.id !== item.id));
                              }
                            }}
                            className="text-zinc-600 hover:text-red-400 p-1"
                          >
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                          </button>
                        </div>

                        {/* Exercises Performed in this session */}
                        <div className="space-y-1.5 pt-1 border-t border-zinc-850">
                          {item.exercises.map((ex, i) => {
                            const meta = exercises.find(m => m.id === ex.exerciseId) || { name: ex.exerciseId };
                            return (
                              <div key={i} className="flex items-center justify-between text-xs py-1">
                                <span className="text-zinc-300 font-medium">{meta.name}</span>
                                <span className="font-mono text-zinc-400">
                                  {ex.sets.map(s => `${s.weight}×${s.reps}`).join(', ')}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {/* TAB 3: EXERCISES & CROSS-SPLIT PROGRESSION */}
            {currentTab === 'exercises' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold text-white tracking-tight">Exercise Library</h2>
                  <span className="text-xs text-zinc-400 font-mono">{exercises.length} Exercises</span>
                </div>

                {/* Search Bar */}
                <div className="relative">
                  <input
                    type="text"
                    placeholder="Search exercise or muscle group..."
                    value={exerciseSearch}
                    onChange={(e) => setExerciseSearch(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-brand-500/50"
                  />
                  {exerciseSearch && (
                    <button 
                      onClick={() => setExerciseSearch('')} 
                      className="absolute right-3 top-3 text-zinc-500 text-xs"
                    >
                      Clear
                    </button>
                  )}
                </div>

                {/* Exercise List */}
                <div className="space-y-2">
                  {exercises
                    .filter(ex => 
                      ex.name.toLowerCase().includes(exerciseSearch.toLowerCase()) || 
                      ex.category.toLowerCase().includes(exerciseSearch.toLowerCase())
                    )
                    .map((ex) => {
                      const lastPerf = getLastExercisePerformance(ex.id);
                      return (
                        <div
                          key={ex.id}
                          onClick={() => setInspectExerciseId(ex.id)}
                          className="bg-zinc-900/80 hover:bg-zinc-850/80 border border-zinc-850 rounded-xl p-3 flex items-center justify-between cursor-pointer transition-all active:scale-98"
                        >
                          <div>
                            <div className="text-sm font-bold text-white">{ex.name}</div>
                            <div className="flex items-center space-x-2 mt-0.5">
                              <span className="text-[10px] text-zinc-400 bg-zinc-800 px-1.5 py-0.2 rounded font-medium">{ex.category}</span>
                              {lastPerf && (
                                <span className="text-[11px] text-brand-400 font-mono">
                                  Last: {lastPerf.sets[0]?.weight}kg ({lastPerf.split})
                                </span>
                              )}
                            </div>
                          </div>
                          <svg className="w-4 h-4 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <polyline points="9 18 15 12 9 6" strokeWidth="2" strokeLinecap="round"/>
                          </svg>
                        </div>
                      );
                    })}
                </div>

                {/* Create Custom Exercise Form */}
                <div className="mt-8 pt-4 border-t border-zinc-850">
                  <h3 className="text-sm font-bold text-zinc-200 mb-2">Add Custom Exercise</h3>
                  <form onSubmit={createCustomExercise} className="space-y-2">
                    <input
                      type="text"
                      placeholder="e.g. Incline Smith Machine Press"
                      value={newExName}
                      onChange={(e) => setNewExName(e.target.value)}
                      className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none"
                    />
                    <div className="flex space-x-2">
                      <select
                        value={newExCategory}
                        onChange={(e) => setNewExCategory(e.target.value)}
                        className="bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none flex-1"
                      >
                        {['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Quads', 'Hamstrings', 'Calves', 'Core'].map(cat => (
                          <option key={cat} value={cat}>{cat}</option>
                        ))}
                      </select>
                      <button
                        type="submit"
                        className="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded-xl text-xs font-bold"
                      >
                        Save
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* TAB 4: SETTINGS & EXPORT */}
            {currentTab === 'settings' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-xl font-bold text-white tracking-tight">Data & Offline PWA</h2>
                  <p className="text-xs text-zinc-400 mt-1">
                    Your workout logs are stored locally on your device for fast offline gym tracking.
                  </p>
                </div>

                {/* iPhone Add to Home Screen Instructions */}
                <div className="bg-brand-500/10 border border-brand-500/20 rounded-2xl p-4 space-y-2">
                  <div className="flex items-center space-x-2 text-brand-400 font-bold text-sm">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                    </svg>
                    <span>Use Like a Native iPhone App</span>
                  </div>
                  <ol className="text-xs text-zinc-300 space-y-1 list-decimal list-inside leading-relaxed">
                    <li>Open this page in <strong>Safari</strong> on your iPhone.</li>
                    <li>Tap the <strong>Share</strong> button (box with an arrow pointing up).</li>
                    <li>Scroll down and tap <strong>"Add to Home Screen"</strong>.</li>
                    <li>Launch it from your home screen for full-screen offline use!</li>
                  </ol>
                </div>

                {/* Backup / Export */}
                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-zinc-200">Data Management</h3>
                  <button
                    onClick={exportDataJSON}
                    className="w-full py-3 bg-zinc-900 border border-zinc-800 hover:bg-zinc-850 rounded-xl text-xs font-semibold text-zinc-200 flex items-center justify-center space-x-2"
                  >
                    <svg className="w-4 h-4 text-brand-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span>Export All Data (JSON)</span>
                  </button>

                  <button
                    onClick={() => {
                      if (confirm("Are you sure you want to reset all data? This cannot be undone.")) {
                        localStorage.clear();
                        window.location.reload();
                      }
                    }}
                    className="w-full py-3 bg-red-950/20 border border-red-900/40 text-red-400 hover:bg-red-950/40 rounded-xl text-xs font-semibold"
                  >
                    Clear All Local History
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* BOTTOM MODAL: ADD EXERCISE DRAWER */}
          {showExercisePicker && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col justify-end">
              <div className="bg-zinc-900 border-t border-zinc-800 rounded-t-3xl max-h-[80vh] flex flex-col p-4 animate-in slide-in-from-bottom duration-200">
                <div className="flex items-center justify-between pb-3 border-b border-zinc-850">
                  <h3 className="font-bold text-white text-base">Select Exercise</h3>
                  <button
                    onClick={() => setShowExercisePicker(false)}
                    className="text-xs bg-zinc-800 text-zinc-300 px-3 py-1 rounded-full font-medium"
                  >
                    Close
                  </button>
                </div>

                <div className="py-2">
                  <input
                    type="text"
                    placeholder="Search exercise..."
                    value={exerciseSearch}
                    onChange={(e) => setExerciseSearch(e.target.value)}
                    className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none"
                  />
                </div>

                <div className="overflow-y-auto space-y-2 py-2 flex-1">
                  {exercises
                    .filter(e => e.name.toLowerCase().includes(exerciseSearch.toLowerCase()))
                    .map(ex => {
                      const lastPerf = getLastExercisePerformance(ex.id);
                      return (
                        <div
                          key={ex.id}
                          onClick={() => addExerciseToActiveWorkout(ex.id)}
                          className="p-3 bg-zinc-950 rounded-xl border border-zinc-850 flex items-center justify-between active:bg-zinc-850 cursor-pointer"
                        >
                          <div>
                            <div className="text-sm font-bold text-white">{ex.name}</div>
                            <div className="text-[11px] text-zinc-400">{ex.category}</div>
                          </div>
                          {lastPerf && (
                            <span className="text-[10px] font-mono text-brand-400 bg-brand-500/10 px-2 py-0.5 rounded">
                              {lastPerf.split}
                            </span>
                          )}
                        </div>
                      );
                    })}
                </div>
              </div>
            </div>
          )}

          {/* INSPECT EXERCISE PROGRESSION MODAL */}
          {inspectExerciseId && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-sm max-h-[85vh] flex flex-col p-4 shadow-2xl">
                {(() => {
                  const meta = exercises.find(e => e.id === inspectExerciseId) || { name: inspectExerciseId, category: '' };
                  // Collect all instances of this exercise from historical workouts
                  const historyEntries = [];
                  workoutHistory.forEach(w => {
                    const found = w.exercises?.find(e => e.exerciseId === inspectExerciseId);
                    if (found && found.sets?.length > 0) {
                      historyEntries.push({
                        date: new Date(w.startTime).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
                        split: w.splitType,
                        sets: found.sets
                      });
                    }
                  });

                  return (
                    <div className="flex flex-col h-full">
                      <div className="flex items-start justify-between pb-3 border-b border-zinc-850">
                        <div>
                          <h3 className="font-bold text-white text-base leading-snug">{meta.name}</h3>
                          <span className="text-xs text-brand-400 font-medium">Cross-Split Progression</span>
                        </div>
                        <button
                          onClick={() => setInspectExerciseId(null)}
                          className="text-xs bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg"
                        >
                          ✕
                        </button>
                      </div>

                      <div className="overflow-y-auto py-3 space-y-2.5 flex-1">
                        {historyEntries.length === 0 ? (
                          <div className="text-center py-8 text-zinc-500 text-xs">
                            No historical records for this exercise yet.
                          </div>
                        ) : (
                          historyEntries.map((entry, idx) => (
                            <div key={idx} className="bg-zinc-950 p-2.5 rounded-xl border border-zinc-850 text-xs">
                              <div className="flex items-center justify-between mb-1.5">
                                <span className="text-zinc-400 font-medium">{entry.date}</span>
                                <span className="capitalize font-bold text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">
                                  {entry.split} Day
                                </span>
                              </div>
                              <div className="font-mono text-zinc-200">
                                {entry.sets.map((s, sIdx) => (
                                  <span key={sIdx} className="inline-block mr-2 text-zinc-300">
                                    Set {sIdx + 1}: <strong className="text-white">{s.weight}kg × {s.reps}</strong>
                                  </span>
                                ))}
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  );
                })()}
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-zinc-950/95 backdrop-blur-lg border-t border-zinc-850 max-w-lg mx-auto px-2 py-2 flex justify-around">
            <button
              onClick={() => setCurrentTab('workout')}
              className={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all ${
                currentTab === 'workout' ? 'text-brand-400' : 'text-zinc-500 hover:text-zinc-300'
              }`}
            >
              <svg className="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
              <span className="text-[10px] font-bold">Workout</span>
            </button>

            <button
              onClick={() => setCurrentTab('history')}
              className={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all ${
                currentTab === 'history' ? 'text-brand-400' : 'text-zinc-500 hover:text-zinc-300'
              }`}
            >
              <svg className="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span className="text-[10px] font-bold">History</span>
            </button>

            <button
              onClick={() => setCurrentTab('exercises')}
              className={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all ${
                currentTab === 'exercises' ? 'text-brand-400' : 'text-zinc-500 hover:text-zinc-300'
              }`}
            >
              <svg className="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M4 6h16M4 12h16M4 18h7" />
              </svg>
              <span className="text-[10px] font-bold">Exercises</span>
            </button>

            <button
              onClick={() => setCurrentTab('settings')}
              className={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all ${
                currentTab === 'settings' ? 'text-brand-400' : 'text-zinc-500 hover:text-zinc-300'
              }`}
            >
              <svg className="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <circle cx="12" cy="12" r="3" strokeWidth="2.2" />
              </svg>
              <span className="text-[10px] font-bold">PWA</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
